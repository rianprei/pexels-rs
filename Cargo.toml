[package]
name = "pexels-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "Busca e download de vídeos e fotos da Pexels: página pública de busca (sem chave) ou API oficial (com chave)"
license = "MIT"

[dependencies]
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
curl = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Regras de morganlinton/BeautifulRust (lints/lints.toml), na variante para aplicação: sem as de biblioteca
# (missing_docs, missing_errors_doc, missing_panics_doc, print_stdout/stderr, exhaustive_enums).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
redundant_clone = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
