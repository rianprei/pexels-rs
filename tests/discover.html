amera-r7ttfbd","id":"r7ttfbd","featured":true,"users":[{"id":2163818374,"username":null,"first_name":"Pexels","last_name":"Curation","staff":true,"slug":"pexels-curation-2163818374","avatar":"https://images.pexels.com/users/avatars/2163818374/pexels-curation-909.png","has_approved_media":false},{"id":956039,"username":"jill","first_name":"Jill","last_name":"Evans","staff":true,"slug":"jill","avatar":"https://images.pexels.com/users/avatars/956039/jill-evans-249.png","has_approved_media":true}],"preview_images":["https://images.pexels.com/photos/1448471/pexels-photo-1448471.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500","https://images.pexels.com/photos/935791/pexels-photo-935791.jpeg?auto=compress&cs=tinysrgb&h=130","https://images.pexels.com/photos/1728163/pexels-photo-1728163.jpeg?auto=compress&cs=tinysrgb&h=130","https://images.pexels.com/photos/1266983/pexels-photo-1266983.jpeg?auto=compress&cs=tinysrgb&h=130"]}},{"id":"pnqk6kd","type":"collection","attributes":{"title":"Dance Like Nobody's Watching","description":"","private":false,"collection_media_count":60,"photos_count":46,"videos_count":14,"slug":"dance-like-nobody-s-watching-pnqk6kd","id":"pnqk6kd","featured":true,"users":[{"id":2163818374,"username":null,"first_name":"Pexels","last_name":"Curation","staff":true,"slug":"pexels-curation-2163818374","avatar":"https://images.pexels.com/users/avatars/2163818374/pexels-curation-909.png","has_approved_media":false}],"preview_images":["https://images.pexels.com/videos/20218504/pexels-photo-20218504.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500","https://images.pexels.com/photos/16662252/pexels-photo-16662252.jpeg?auto=compress&cs=tinysrgb&h=130","https://images.pexels.com/photos/5585860/pexels-photo-5585860.jpeg?auto=compress&cs=tinysrgb&h=130","https://images.pexels.com/photos/5149589/pexels-photo-5149589.jpeg?auto=compress&cs=tinysrgb&h=130"]}}],"pagination":{"current_page":1,"total_pages":96,"total_results":1150}},"interviews":[{"id":"192","type":"blog_post","attributes":{"id":192,"slug":"nadine-wuchenauer-harmony-photography","color_scheme":null,"post_type":"hero_story","title":"Nadine Wuchenauer Finds Harmony in Photography","description":"\"When I see something I want to capture, I just start shooting and try to find the most beautiful angle.\" German photographer Nadine Wuchenauer shares the story behind her work.","medium_id":1528978,"user_callout_text":"","imgix_crop":"","meta_title":"Nadine Wuchenauer Finds Harmony in Photography","publish_at":"2021-04-14T01:01:00.000Z","pexels_markdown":"## Welcome to Hero of the Week, an ongoing series sharing stories from some of the best photographers in the Pexels community.\r\n\r\nLocated in Cologne, Germany, Nadine Wuchenauer is a photographer with a wide range of work, from beauty and fashion to still lifes and travel shots. \r\n\r\nWe particularly like her creative outdoor close-ups, capturing the intricate details of nature in all its seasons. Nadine told us about how she got started with shooting photos, and why keeping photography exciting is so important. \r\n\r\n<image-grid>\r\n<pexels-image id=\"1726779\">\r\n</pexels-image>\r\n<pexels-image id=\"1536302\">\r\n</pexels-image>\r\n</image-grid>\r\n\r\n## Pexels: How long have you been taking photos, and how did you get started?\r\n\r\n**Nadine:** I’ve been taking photos since I was a teenager. I’ve always been addicted to cameras and capturing everything I thought was beautiful. \r\n\r\nWhen I was thirteen or fourteen I started by taking pictures of flowers and landscapes — I think just like most people that start to do photography. After some time I continued to take lots and lots of portraits of friends and then models later on. \r\n\r\nI found my motivation to start photography on more professional terms during a photography course at university (I originally studied media science and communications) and then just somehow dived into being a freelance photographer.\r\n\r\n## What camera gear do you use?\r\n\r\nAt the moment I’m using a Sony Alpha 7R IV along with some Sigma Art Lenses (35mm f1.4, 85mm f1.4, 100mm f2.8). \r\n\r\n<image-grid>\r\n\t<pexels-image id=\"3999059\">\r\n</pexels-image>\r\n<pexels-image id=\"3999071\">\r\n</pexels-image>\r\n</image-grid>\r\n\r\n## What's your favorite type of photo to shoot, and why?\r\n\r\nMy favorite type of photos to shoot are beauty portraits. I love to capture the beauty of people and create an artwork out of faces, color, and make-up. \r\n\r\nAlso, it’s always fun to work with different creatives and create new artworks together. That kind of work somehow just inspires and intrigues me a lot.\r\n\r\n## What inspires your photography?\r\n\r\nMy work is mainly inspired by the beauty of the object itself. Sometimes that object is as easy as a light strip on the floor or the colors of flowers. When I see something I want to capture, I just start shooting and try to find the most beautiful angle of the object. A lot of people shoots are also based on the make-up looks and therefore color schemes we want to implement. \r\n\r\n## Tell us about a favorite photo or video on your Pexels profile. Why is this one your favorite?\r\n\r\nThat’s a really hard decisions. I chose this picture: \r\n\r\n<pexels-image id=\"1528979\">\r\n</pexels-image>\r\n\r\nI chose this picture just because I love the minimalistic, harmonic look of this picture. I like clean, harmonic works. Also I love the happy vibe it gives through the sunlight there. \r\n\r\nI didn’t choose the picture because it’s the most creative, technically perfect picture ever, but because I love the vibe that comes with it for me. And I think that’s what photography is mainly about: capturing atmosphere, moments, and giving the viewer some kind of feelings. \r\n\r\n## Who are some other photographers or artists who inspire your work? \r\n\r\nI really don’t have any photographers that I would name that inspire my work. I take inspiration from everything I see, this might be posts of other photographers on Instagram, content in magazines, but as well older artworks in museums or just nature. \r\n\r\nPhotographers that I really look up to usually aren’t people that I’m necessarily inspired by only because of their work, but because of their career and development. \r\n\r\n<pexels-image id=\"1726783\">\r\n</pexels-image>\r\n\r\n## What is one goal you have for your photography?\r\n\r\nMy goal regarding photography as art is to never lose the excitement I get when creating new works. My goal regarding business is to be booked by bigger brands, and to be able to make a good living out of the work that I love. \r\n\r\n### *Pexels Heroes is our invite-only community of the top photographers on Pexels. [Find out more and apply to join here.](https://www.pexels.com/hero)* \r\n\r\n<pexels-image id=\"1529031\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"1529076\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"1529041\">\r\n</pexels-image>","blog_author":null,"user":{"id":695910,"first_name":"Nadine","last_name":"Wuchenauer","username":null,"instagram":"nadine.wuchenauer","twitter":"","youtube":null,"tiktok":null,"website":"","bio":"","image_views_last_30_days":0,"image_views_all_time":254152043,"approved_uploads_last_30_days":0,"followers_count":936,"followings_count":1,"hide_from_leaderboard":false,"open_to_receive_messages":true,"last_uploaded_at":"2022-12-01T12:27:44.000Z","staff":false,"challenges_won_count":0,"challenges_participated_count":2,"first_uploaded_on":"2018-10-21","homepage_featured_count":2,"meetups_attended_count":0,"shortlist_collections_count":0,"confirmed":true,"has_approved_media":true,"leaderboard_last_30_days_position":null,"leaderboard_all_time_position":423,"leaderboard_approved_uploads_last_30_days_position":null,"photos_count":92,"media_count":92,"portfolio_media_count":0,"collections_count":1,"avatar":{"small":"https://images.pexels.com/users/avatars/695910/nadine-wu-380.jpeg?auto=compress&fit=crop&h=60&w=60","medium":"https://images.pexels.com/users/avatars/695910/nadine-wu-380.jpeg?auto=compress&fit=crop&h=256&w=256"},"following":false,"paypal":null,"slug":"nadine-wuchenauer-695910","hero":true,"superhero":false,"active_hero":false,"location":"Germany","donation_links":[],"donate_url":"#","badges":[{"kind":"hero","year":2020,"active":true},{"kind":"hero","year":2021,"active":true},{"kind":"hero","year":2022,"active":true}],"full_name":"Nadine Wuchenauer"},"image_url":"https://images.pexels.com/photos/1528978/pexels-photo-1528978.jpeg"}},{"id":"187","type":"blog_post","attributes":{"id":187,"slug":"david-yu-photos-in-search-of-simplicity","color_scheme":null,"post_type":"hero_story","title":"David Yu's Photos Go in Search of Simplicity","description":"Classic street scenes reimagined with an eye for geometric details.","medium_id":2793490,"user_callout_text":"","imgix_crop":"focalpoint","meta_title":"David Yu's Photos Go in Search of Simplicity","publish_at":"2021-04-01T01:01:00.000Z","pexels_markdown":"## Welcome to Hero of the Week, an ongoing series sharing stories from some of the best photographers in the Pexels community.\r\n\r\nDavid Yu is inspired by simplicity. Currently an economics undergrad at Cornell University, he's been living in Beijing due to Covid. \r\n\r\nWe're captivated by the creative geometry of David's street scenes and everyday captures. He told us about why he believes photography is all about mindset, and how Henri Cartier-Bresson inspires his work.  \r\n\r\n<pexels-image id=\"3124958\">\r\n</pexels-image>\r\n\r\n## Pexels: How long have you been taking photos, and how did you get started?\r\n\r\n**David:** I started taking photos in 2015, and it has been six years now. \r\n\r\nIt all started when my parent gave me an old iPad as a New Year present. I still remember the excitement I had with the photo app. Although the resolution was low, it did not bother me using it to \"recreate\" the world around me. That is how I started my path in photography.\r\n\r\n## What camera gear do you use?\r\n\r\nMy primary device is a Nikon D810, with an 18-300 Tamron lens. For special occasions, I also use a 50mm lens. I also use my phone, an OnePlus 7T, as a daily camera.\r\n\r\n<pexels-image id=\"1749721\">\r\n</pexels-image>\r\n\r\n## What's your favorite type of photo to shoot?\r\n\r\nI am fascinated by simplistic photos about geometric patterns residing in small aspects of reality. I think this view angle allows me to reshape commonly seen objects and landscapes and express the simplicity I admire.\r\n\r\n## What inspires your photography?\r\n\r\nAnything. I think there are so many beautiful views one can get from even the simplest object. One only needs the right mindset.\r\n\r\n## Tell us about your favorite photo on your Pexels profile. \r\n\r\n<pexels-image id=\"2081166\">\r\n</pexels-image>\r\n\r\nThis photo is my favorite. It was really a common photo before editing. Still, when I was tuning it, I suddenly realized how it resembles time-traveling tunnels in the classic sci-fi comics, and how people traveling on the track fit into the picture. \r\n\r\nIt was as if a hidden sci-fi scene is placed in the quiet national gallery of art. I love this kind of juxtaposition.\r\n\r\n## What photographers or artists inspire your work? \r\n\r\nMostly, I communicate with photographers in my community: my university classmates, my friends, etc. I also learned a lot about compositions, colors, and viewing angles from friends in the art major. Special thanks to Jasmine Zuo, whose artworks really inspired many of my geometrically composed photos. \r\n\r\nIn terms of the famous photographers, I love [Henri Cartier-Bresson](https://www.magnumphotos.com/photographer/henri-cartier-bresson/) the best. After learning about his work *[Rue Mouffetard](https://www.moma.org/collection/works/88041)* I am fascinated by how one can express so many emotions from everyday activities. Although I seldom take portraits, the idea of condensed expression showed me how the masters in photography create.\r\n\r\n<pexels-image id=\"2793494\">\r\n</pexels-image>\r\n\r\n## What is one goal you have for your photography?\r\n\r\nMy goal: to produce great photos and have my photos used by media and websites internationally. Hopefully, one day one of my photos will reach my parents on their daily news app in China as a surprise.\r\n\r\n### *Pexels Heroes is our invite-only community of the top photographers on Pexels. [Find out more and apply to join here.](https://www.pexels.com/hero)* \r\n\r\n<pexels-image id=\"3587765\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"1582547\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"1654138\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"2708862\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"2693810\">\r\n</pexels-image>","blog_author":null,"user":{"id":55821,"first_name":"David","last_name":"Yu","username":"PSAD","instagram":"dyu_117","twitter":"","youtube":"","tiktok":"","website":"","bio":"Photography for life","image_views_last_30_days":0,"image_views_all_time":150333774,"approved_uploads_last_30_days":0,"followers_count":1007,"followings_count":4,"hide_from_leaderboard":false,"open_to_receive_messages":true,"last_uploaded_at":"2026-08-12T01:23:59.000Z","staff":false,"challenges_won_count":0,"challenges_participated_count":14,"first_uploaded_on":"2016-10-17","homepage_featured_count":11,"meetups_attended_count":0,"shortlist_collections_count":0,"confirmed":true,"has_approved_media":true,"leaderboard_last_30_days_position":null,"leaderboard_all_time_position":728,"leaderboard_approved_uploads_last_30_days_position":null,"photos_count":1373,"media_count":1373,"portfolio_media_count":6,"collections_count":4,"avatar":{"small":"https://images.pexels.com/users/avatars/55821/david-yu-373.jpeg?auto=compress&fit=crop&h=60&w=60","medium":"https://images.pexels.com/users/avatars/55821/david-yu-373.jpeg?auto=compress&fit=crop&h=256&w=256"},"following":false,"paypal":null,"slug":"psad","hero":true,"superhero":false,"active_hero":false,"location":"Boston, Massachusetts, United States","donation_links":[],"donate_url":"#","badges":[{"kind":"hero","year":2019,"active":true},{"kind":"hero","year":2020,"active":true}],"full_name":"David Yu"},"image_url":"https://images.pexels.com/photos/2793490/pexels-photo-2793490.jpeg"}},{"id":"185","type":"blog_post","attributes":{"id":185,"slug":"max-ravier-minimal-mood","color_scheme":null,"post_type":"hero_story","title":"Max Ravier's Minimal Mood","description":"Take a visual break with Sydney photographer Max Ravier's perfectly simple landscapes. ","medium_id":3331094,"user_callout_text":"","imgix_crop":"top","meta_title":"Max Ravier's Minimal Mood","publish_at":"2021-03-17T01:01:00.000Z","pexels_markdown":"## Welcome to Hero of the Week, an ongoing series sharing stories from some of the best photographers in the Pexels community.\r\n\r\nSydney, Australia photographer Max Ravier creates minimalistic landscape shots full of color. He's also the owner of media content company [VertProd](https://www.vertprod.com). We caught up with Max to chat about his photography and his changing aesthetic style. \r\n\r\n## Pexels: How long have you been taking photos, and how did you get started?\r\n\r\n**Max:** I have been taking photos for the last four years. I weirdly enough hated taking photos before. But one day my parents got me a GoPro for my birthday. I ended up using it during holidays in Bali and loved it. \r\n\r\nNext thing you know I got hooked on it. Bought a camera afterward, then a drone, and now even have an underwater camera cage.\r\nI love taking different perspectives.\r\n\r\n<pexels-image id=\"2253819\">\r\n</pexels-image>\r\n\r\n## What camera gear do you use?\r\n\r\nMy camera gear is Sony a7III, it is a beast of a camera and really reliable. As for the drone, I have the Mavic 2 Pro.\r\n\r\n## What's your favorite type of photo to shoot, and why?\r\n\r\nMy favorite type of photo to shoot has really changed with time. I use to really love doing drone shots with dreamy pink sunsets, but at the moment I am much more into minimalistic photography: bringing the least amount of texture in my shot to single out the subject. And I am sure it will change soon.\r\n\r\n## What inspires your photography?\r\n\r\nWhat inspires my photography? I would say music. I usually go to shoot while listening to music and depending on the mood of the music I will really shoot different things. Same for the editing phase of my photos.\r\n\r\n## Tell us about a favorite photo from your Pexels profile.\r\n\r\nHere are a few of my favorite shots from the moment:\r\n\r\n<pexels-image id=\"5897282\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"5833621\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"5605762\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"5605771\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"5589103\">\r\n</pexels-image>\r\n\r\n## Who are some other photographers or artists who inspire your work? \r\n\r\nMy main photographer crush of the moment must be [Karl Shakur](https://www.karlshakur.com). His photos are so fresh and new that I am absolutely obsessed with them. Especially that minimalist approach to photography.\r\n\r\n## What is one goal you have for your photography?\r\n\r\nThe only goal I have for photography is having fun. As I work as a filmmaker for advertisements I want to be able to keep photography as a fun thing I do. Not for work.\r\n\r\n### *Pexels Heroes is our invite-only community of the top photographers on Pexels. [Find out more and apply to join here.](https://www.pexels.com/hero)* \r\n\r\n<pexels-image id=\"5873908\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"5605770\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"5605768\">\r\n</pexels-image>","blog_author":null,"user":{"id":1183810,"first_name":"Max","last_name":"Ravier","username":"maxravier","instagram":"maxravier","twitter":"","youtube":"","tiktok":"","website":"http://www.vertprod.com","bio":"Videographer sharing his passion for photos here and on @maxravier.\nDonations will all go towards my travels!","image_views_last_30_days":0,"image_views_all_time":216766845,"approved_uploads_last_30_days":0,"followers_count":2653,"followings_count":0,"hide_from_leaderboard":false,"open_to_receive_messages":true,"last_uploaded_at":"2023-06-26T13:42:48.000Z","staff":false,"challenges_won_count":0,"challenges_participated_count":27,"first_uploaded_on":"2019-04-30","homepage_featured_count":28,"meetups_attended_count":0,"shortlist_collections_count":0,"confirmed":true,"has_approved_media":true,"leaderboard_last_30_days_position":null,"leaderboard_all_time_position":496,"leaderboard_approved_uploads_last_30_days_position":null,"photos_count":375,"media_count":375,"portfolio_media_count":26,"collections_count":0,"avatar":{"small":"https://images.pexels.com/users/avatars/1183810/max-ravier-789.jpeg?auto=compress&fit=crop&h=60&w=60","medium":"https://images.pexels.com/users/avatars/1183810/max-ravier-789.jpeg?auto=compress&fit=crop&h=256&w=256"},"following":false,"paypal":null,"slug":"maxravier","hero":true,"superhero":true,"active_hero":false,"location":"sydney","donation_links":[{"provider":"pay_pal","link_value":"maxravier1@gmail.com","link_type":"paypal_email","donation_url":"https://www.paypal.com/cgi-bin/webscr?business=maxravier1%40gmail.com&cmd=_donations&currency_code=USD&item_name=Max+Ravier+-+Pexels&lc=US&return=return_to_url"}],"donate_url":"https://www.paypal.com/cgi-bin/webscr?business=maxravier1%40gmail.com&cmd=_donations&currency_code=USD&item_name=Max+Ravier+-+Pexels&lc=US&return=return_to_url","badges":[{"kind":"hero","year":2019,"active":true},{"kind":"hero","year":2020,"active":true},{"kind":"hero","year":2021,"active":true},{"kind":"hero","year":2022,"active":true},{"kind":"hero","year":2023,"active":true},{"kind":"superhero","year":2026,"active":false}],"full_name":"Max Ravier"},"image_url":"https://images.pexels.com/photos/3331094/pexels-photo-3331094.jpeg"}},{"id":"182","type":"blog_post","attributes":{"id":182,"slug":"steshka-willems-captures-uniqueness-portraits","color_scheme":null,"post_type":"hero_story","title":"Steshka Willems Captures Uniqueness in Her Portraits","description":"The Netherlands-based photographer shoots heartfelt portraits of the people around her. ","medium_id":1658933,"user_callout_text":"","imgix_crop":"faces","meta_title":"Steshka Willems Captures Uniqueness in Her Portraits","publish_at":"2021-03-08T01:01:00.000Z","pexels_markdown":"## Welcome to Hero of the Week, an ongoing series sharing stories from some of the best photographers in the Pexels community.\r\n\r\nCurrently studying to become an art teacher at the Maastricht Academy of Fine Arts, Steshka is a 23-year-old photographer who shoots heartfelt portraits of the people around her. \r\n\r\nAs Steshka tells us, she was \"born and raised on the beautiful island of Aruba, but now I’m living in Weert, the Netherlands.\" She can often be found shooting photos of daily life as well as playful portraits that really capture the mood of her subjects. We talked to Steshka about why she loves photography.  \r\n\r\n<pexels-image id=\"1921190\">\r\n</pexels-image>\r\n\r\n## Pexels: How long have you been taking photos, and how did you get started? \r\n\r\n**Steshka:** I started at the age of fourteen with just my phone. As I got more interested in photography, I started doing research on cameras. After I got my very first camera I was so happy and ready to start experimenting.\r\n\r\n## What camera gear do you use? \r\n\r\nI use a Fuji X-T3 with a 16-55 2.8 wide lens.\r\n\r\n<pexels-image id=\"3018993\">\r\n</pexels-image>\r\n\r\n## What's your favorite type of photo to shoot, and why? \r\n\r\nI’d have to say [portrait photography](https://www.pexels.com/blog/resource/portrait-photography-find-and-work-with-subjects/). Capturing the uniqueness of all the different people is the true beauty of this genre.\r\n\r\n## What inspires your photography? \r\n\r\nWhat inspires me in photography is telling a story with it. That makes the job of being a photographer one of the most valuable.\r\n\r\n## Tell us about your favorite photo on your Pexels profile.\r\n\r\n<pexels-image id=\"2686397\">\r\n</pexels-image>\r\n\r\nThis photo for me truly emits peace, innocence, happiness and peace of mind—all of which are priceless. \r\n\r\nI can really see my progress in this photo since I begun my journey in photography and it brings a feeling inside that makes me really proud to see how far I’ve come. On a personal level the person portrayed is dear to me and all these things together make this photo my favorite.\r\n\r\n## Who are some other photographers or artists who inspire your work? \r\n\r\nI really love the work of [Eberhard Grossgasteiger](https://www.pexels.com/blog/hero-story/meet-hero-of-the-week-eberhard-grossgasteiger/). He captures the true essence of nature. When I see his content it makes me want to grab my camera and start photographing. \r\n\r\n<pexels-image id=\"4536190\">\r\n</pexels-image>\r\n\r\n## What is one goal you have for your photography? \r\n\r\nTo inspire others to start photography too!\r\n\r\n### *Pexels Heroes is our invite-only community of the top photographers on Pexels. [Find out more and apply to join here.](https://www.pexels.com/hero)* \r\n\r\n<pexels-image id=\"1308714\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"1540417\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"2381124\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"1973177\">\r\n</pexels-image>\r\n\r\n<pexels-image id=\"1289903\">\r\n</pexels-image>","blog_author":null,"user":{"id":54039,"first_name":"Steshka","last_name":"Croes","username":"steshkacroes","instagram":"akhsets","twitter":"","youtube":"","tiktok":"","website":"http://www.steshka.com","bio":"Grateful for every like and donation :)","image_views_last_30_days":0,"image_views_all_time":94397553,"approved_uploads_last_30_days":0,"followers_count":816,"followings_count":7,"hide_from_
